<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oral</title>
  <style>
    body { margin: 0; background: #fff; color: #222; font: 1rem/1.65 system-ui, sans-serif; }
    main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1.75rem; max-width: 62rem; margin: clamp(1.5rem, 6vw, 4rem) auto; padding: 0 3.25rem; }
    .date { margin-bottom: 1rem; color: #555; font-variant-numeric: tabular-nums; }
    aside { border-left: 1px solid #ddd; padding-left: 1rem; }
    @media (max-width: 42rem) { aside { border-left: 0; border-top: 1px solid #ddd; padding: 1rem 0 0; } }
    button { position: fixed; top: 50%; transform: translateY(-50%); width: 2.5rem; height: 2.75rem; border: 0; border-radius: .25rem; background: #fff; color: #222; font: 1.6rem system-ui, sans-serif; cursor: pointer; }
    button:hover:not(:disabled), button:focus-visible { background: #eee; }
    button:disabled { color: #767676; cursor: default; }
    #previous { left: .25rem; }
    #next { right: .25rem; }
    @media (max-width: 42rem) { main { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; padding-inline: 2.75rem; } }
    @media (max-width: 24rem) { main { padding-inline: 2.25rem; } button { width: 1.85rem; } }
    section + section { border-top: 1px solid #ddd; margin-top: 1.25rem; padding-top: 1.25rem; }
    p { margin: 0 0 .5rem; }
    p:last-child { margin-bottom: 0; }
    .line { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); }
    .speaker { font-weight: 650; }
  </style>
</head>
<body>
  <button type="button" id="previous" aria-label="上一天" title="上一天" disabled>‹</button>
  <button type="button" id="next" aria-label="下一天" title="下一天" disabled>›</button>
  <main>
    <article id="lesson">
      <p class="date"><time id="date"></time></p>
      <section id="scenario" aria-label="AI 出题"></section>
      <section id="draft" aria-label="初始对话" lang="en"></section>
      <section id="revised" aria-label="优化对话" lang="en"></section>
    </article>
    <aside id="notes" aria-label="Note"></aside>
  </main>
  <script>
    const lesson = document.getElementById('lesson');
    const date = document.getElementById('date');
    const scenario = document.getElementById('scenario');
    const draft = document.getElementById('draft');
    const revised = document.getElementById('revised');
    const notes = document.getElementById('notes');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    let dates = [];
    let currentDay = 1;
    let activeRequest;

    async function readText(path, signal) {
      const response = await fetch(path, { signal });
      if (!response.ok) throw new Error('无法读取 ' + path);
      return response.text();
    }

    function contentLines(text) {
      return text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    }

    function parseLesson(text) {
      const sections = { '【场景】': [], '【角色】': [], '【初始对话】': [], '【优化对话】': [], '【笔记】': [] };
      let section;
      for (const line of contentLines(text)) {
        if (Object.hasOwn(sections, line)) {
          section = sections[line];
        } else if (section) {
          section.push(line);
        } else {
          throw new Error('请在正文前填写段落标题，例如【场景】。');
        }
      }
      return sections;
    }

    function paragraph(text) {
      const element = document.createElement('p');
      element.textContent = text;
      return element;
    }

    function dialogueLine(line, index) {
      const element = paragraph('');
      const speaker = document.createElement('span');
      const words = document.createElement('span');
      element.className = 'line';
      speaker.className = 'speaker';
      speaker.textContent = index % 2 === 0 ? 'A' : 'B';
      words.textContent = line;
      element.append(speaker, words);
      return element;
    }

    function noteLine(example, tip = '') {
      const element = paragraph('');
      const phrase = document.createElement('span');
      phrase.lang = 'en';
      phrase.textContent = example;
      element.append(phrase, ' ' + tip);
      return element;
    }

    async function showDay() {
      activeRequest?.abort();
      activeRequest = new AbortController();
      const { signal } = activeRequest;
      const requestedDay = Number(location.hash.slice(1));
      currentDay = Number.isInteger(requestedDay) && requestedDay >= 1 && requestedDay <= dates.length
        ? requestedDay
        : 1;

      const day = dates[currentDay - 1];
      lesson.setAttribute('aria-label', '第 ' + currentDay + ' 天');
      date.dateTime = day;
      date.textContent = day;
      previous.disabled = currentDay === 1;
      next.disabled = currentDay === dates.length;
      scenario.textContent = '正在读取练习…';
      draft.replaceChildren();
      revised.replaceChildren();
      notes.replaceChildren();

      try {
        const text = await readText('lessons/' + day + '.txt', signal);
        if (signal.aborted) return;
        const parts = parseLesson(text);
        scenario.replaceChildren(...parts['【场景】'].map(paragraph), ...parts['【角色】'].map(dialogueLine));
        draft.replaceChildren(...parts['【初始对话】'].map(dialogueLine));
        revised.replaceChildren(...parts['【优化对话】'].map(dialogueLine));
        const lines = parts['【笔记】'];
        for (let i = 0; i < lines.length; i += 2) {
          notes.append(noteLine(lines[i], lines[i + 1]));
        }
      } catch (error) {
        if (!signal.aborted) scenario.textContent = '练习加载失败。' + error.message;
      }
    }

    async function start() {
      try {
        dates = contentLines(await readText('lessons/index.txt'));
        if (!dates.length) {
          scenario.textContent = '还没有练习。';
          return;
        }
        window.addEventListener('hashchange', showDay);
        await showDay();
      } catch (error) {
        scenario.textContent = location.protocol === 'file:'
          ? '请在项目目录运行 python3 -m http.server，然后打开 http://localhost:8000。'
          : '练习目录加载失败。' + error.message;
      }
    }

    previous.addEventListener('click', () => { location.hash = String(currentDay - 1); });
    next.addEventListener('click', () => { location.hash = String(currentDay + 1); });
    start();
  </script>
</body>
</html>
